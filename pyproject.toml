[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudwatch-signoz"
version = "0.1.0"
description = "Collect EC2 CPU credit balances from CloudWatch and send them to SigNoz"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
cloudwatch-signoz = "cloudwatch_signoz.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

